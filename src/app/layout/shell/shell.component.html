<div class="d-flex" style="min-height:100vh">
  <!-- Sidebar -->
  <nav class="sidebar d-flex flex-column p-3" style="width:250px;min-height:100vh;flex-shrink:0">
    <div class="d-flex align-items-center mb-4 px-1">
      <div class="d-flex align-items-center justify-content-center text-white fw-bold me-2"
           style="width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#7b9fff,#5b7ef5);font-size:11px">MB</div>
      <div>
        <div class="fw-bold" style="color:var(--ink);font-size:0.9rem">MyBudget</div>
        <div style="color:var(--muted);font-size:0.68rem;font-family:var(--mono);letter-spacing:0.5px;text-transform:uppercase">Personal Finance</div>
      </div>
    </div>
    <div class="mb-4">
      <div class="d-flex align-items-center p-2 rounded" style="background:var(--surface-2)">
        <div class="d-flex align-items-center justify-content-center text-white fw-bold me-2"
             style="width:30px;height:30px;border-radius:8px;background:var(--primary-2);font-size:12px;flex-shrink:0">{{ auth.userInitials() }}</div>
        <div class="flex-grow-1 overflow-hidden">
          <div class="fw-semibold text-truncate" style="font-size:0.8rem;color:var(--ink)">{{ auth.fullName() }}</div>
          <div class="text-truncate" style="font-size:0.68rem;color:var(--muted)">{{ auth.currentUser()?.email }}</div>
        </div>
        <div class="dropdown">
          <button class="btn btn-sm p-0 px-1" style="color:var(--muted)" data-bs-toggle="dropdown"><i class="bi bi-chevron-down"></i></button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><button class="dropdown-item" (click)="auth.logout()"><i class="bi bi-box-arrow-right me-2"></i>{{ 'auth.logout' | translate }}</button></li>
          </ul>
        </div>
      </div>
    </div>
    <ul class="nav flex-column flex-grow-1">
      @for (item of navItems; track item.path) {
        <li class="nav-item">
          <a class="nav-link d-flex align-items-center gap-2 rounded mb-1"
             [routerLink]="item.path"
             routerLinkActive="active">
            <i class="bi" [class]="item.icon"></i>
            <span>{{ item.labelKey | translate }}</span>
          </a>
        </li>
      }
    </ul>
    <div class="mt-auto">
      <a class="nav-link d-flex align-items-center gap-2 rounded"
         routerLink="/settings" routerLinkActive="active">
        <i class="bi bi-gear"></i><span>{{ 'nav.settings' | translate }}</span>
      </a>
    </div>
  </nav>
  <!-- Main content -->
  <div class="flex-grow-1 d-flex flex-column shell-main">
    <header class="shell-header px-4 py-3 d-flex align-items-center justify-content-end">
      <div class="d-flex align-items-center gap-2 small" style="color:var(--muted)">
        <i class="bi bi-calendar3"></i>
        <span style="font-family:var(--mono)">{{ currentMonth() }}</span>
      </div>
    </header>
    <main class="p-4 flex-grow-1" style="max-width:1400px;width:100%;margin:0 auto">
      <router-outlet />
    </main>
  </div>
</div>
